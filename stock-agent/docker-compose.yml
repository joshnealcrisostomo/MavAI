services:
  stock-agent:
    build: .
    image: stock-agent
    ports:
      - "8080:8080"          # http://localhost:8080        -> Streamlit UI
                             # http://localhost:8080/api/docs -> FastAPI Swagger
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - AGENT_MODEL=${AGENT_MODEL:-llama-3.3-70b-versatile}
      - FAST_MODEL=${FAST_MODEL:-llama-3.1-8b-instant}
      - PORT=8080
    volumes:
      - ./mlruns:/app/mlruns         # persist MLflow runs to the host
